<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfumes Lux - Registro</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@200..1000&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

</head>
<body>

    <div id="header-placeholder"></div>

    <!-- Main -->

    <main class="main-content">
        
        <!-- Título de la página -->

        <div class="titulo-pagina">
            <h1 class="section-title section-title-border">Registro de usuarios</h1>
        </div>

        <!-- Formulario -->
        <div class="shell shell-small clear">
            <section class="content">

                <p class="campos-obligatorios"><br> *Campos obligatorios</p>

                <form class="formulario-registro">

                    <!-- Columna izquierda -->

                    <div class="columna-formulario">

                        <div class="campo">
                            <label for="nombres">Nombres*</label>
                            <input 
                                type="text"
                                id="nombres"
                                name="nombres"
                                placeholder="Ej: Juan Esteban"
                                required
                            >
                        </div>

                        <div class="campo">
                            <label for="apellidos">Apellidos*</label>
                            <input 
                                type="text"
                                id="apellidos"
                                name="apellidos"
                                placeholder="Ej: Pérez Molina"
                                required
                            >
                        </div>

                        <div class="campo">
                            <label for="tipo-identificacion">Tipo de identificación*</label>

                            <select 
                                name="tipo-identificacion" 
                                id="tipo-identificacion"
                                required
                            >   
                                <option value="" disable selected>Seleccione un tipo de identificación</option>                       
                                <option value="cc">Cédula de ciudadanía</option>
                                <option value="ce">Cédula de extranjería</option>
                                <option value="pasaporte">Pasaporte</option>
                            </select>
                        </div>

                        <div class="campo">
                            <label for="numero-identificacion">Número de identificación*</label>
                            <input 
                                type="text"
                                id="numero-identificacion"
                                name="numero-identificacion"
                                placeholder="Ej: 1040289751"
                            >
                        </div>

                    </div>

                    <!-- Columna derecha -->

                    <div class="columna-formulario">

                        <div class="campo">
                            <label for="fecha-nacimiento">Fecha de nacimiento*</label>
                            <input 
                                type="date"
                                id="fecha-nacimiento"
                                name="fecha-nacimiento"
                                required
                            >
                        </div>

                        <div class="campo">
                            <label for="celular">Celular*</label>
                            <input 
                                type="tel" 
                                id="celular"
                                name="celular"
                                placeholder="Ej: 3001234567"
                                required
                            >
                        </div>

                        <div class="campo">
                            <label for="correo">Correo electrónico*</label>
                            <input 
                                type="email"
                                id="correo"
                                name="correo"
                                placeholder="Ej: juan.perez@gmail.com"
                                required>
                        </div>

                        <div class="campo campo-pass">
                            <label for="contrasena">Contraseña*</label>
                            
                            <div class="contenedor-pass">
                                <input 
                                    type="password"
                                    id="contrasena"
                                    name="contrasena"
                                    placeholder="Ej: Abc1234*"
                                    required>

                                <button
                                    type="button"
                                    id="mostrar-pass"
                                    aria-label="Mostrar contraseña">
                                    <i class="bi bi-eye"></i>
                                </button>

                            </div>

                        </div>

                    </div>

                    <!-- Botón Registrarse -->

                    <section class="section section-primary">
                        <div class="form form-contact">
                            <button type="submit" class="btn form-btn btn-grey">
                                Registrarse
                            </button>
                        </div>
                    </section>

                </form>
            </section>
        </div>
    </main>

    <!-- Footer -->

    <div id="footer-placeholder"></div>

    <script src="main.js"></script>

</body>
</html>
